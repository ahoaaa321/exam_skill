<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>找回密码 / 职业技能等级认定</title>
    <link rel="stylesheet" href="/assets/css/theme.css?v=8">
</head>
<body>
<main class="auth-page">
            <canvas class="auth-canvas-bg" data-src="/assets/img/auth-bg.png"></canvas>
    <div class="auth-video-overlay"></div><div class="auth-bg-orbs"><div class="auth-orb auth-orb-1"></div><div class="auth-orb auth-orb-2"></div><div class="auth-orb auth-orb-3"></div></div>
    <div class="auth-wrap">
        <a class="brand" href="/"><img src="/assets/logo.svg" alt="logo" class="brand-logo"><strong>职业技能等级认定</strong></a>
        <section class="auth-card">
            <div class="eyebrow">ACCOUNT RECOVERY</div>
            <h1>找回登录密码</h1>
            <p>选择一种方式验证身份后设置新密码。</p>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('email')">邮箱验证码</button>
                <button class="tab" onclick="switchTab('token')">恢复令牌</button>
            </div>

            <!-- 邮箱验证码方式 -->
            <form class="form" id="recovery-form" style="margin-top:20px">
                <label>注册邮箱
                    <input name="email" type="email" required placeholder="请输入注册时使用的邮箱">
                </label>
                <label>邮箱验证码
                    <div class="code-input-group">
                        <input name="code" required placeholder="请输入6位验证码">
                        <button type="button" class="btn" id="send-code-btn">获取验证码</button>
                    </div>
                </label>
                <label>新密码
                    <input name="newPassword" required type="password" minlength="8" placeholder="至少8位，含字母和数字">
                </label>
                <label>确认新密码
                    <input name="confirmPassword" required type="password" minlength="8" placeholder="再次输入新密码">
                </label>
                <button class="btn btn-primary" type="submit">确认重置密码</button>
            </form>

            <!-- 恢复令牌方式 -->
            <form class="form" id="token-form" hidden style="margin-top:20px">
                <label>账号恢复令牌
                    <input name="token" required placeholder="请输入注册时获得的16位恢复令牌">
                </label>
                <label>新密码
                    <input name="newPassword" required type="password" minlength="8" placeholder="至少8位，含字母和数字">
                </label>
                <label>确认新密码
                    <input name="confirmPassword" required type="password" minlength="8" placeholder="再次输入新密码">
                </label>
                <button class="btn btn-primary" type="submit">确认重置密码</button>
            </form>

            <div class="auth-foot">
                <a href="/auth/login.html">← 返回登录</a>
                <a href="/auth/register.html">注册账号</a>
            </div>
            <div class="hint">验证码将通过QQ邮箱发送，请注意查收</div>
        </section>
    </div>
</main>
<script src="/assets/js/common/api.js?v=11"></script>
<script src="/assets/js/auth/auth.js?v=11"></script><script src="/assets/js/auth/auth-canvas.js?v=1"></script><script src="/assets/js/auth/auth-orbs.js?v=1"></script>
<script>bindForgotPassword()</script>
</body>
</html>
