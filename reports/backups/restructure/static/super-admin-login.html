<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>超级管理员登录 / 职业技能等级认定</title>
    <link rel="stylesheet" href="/assets/css/theme.css?v=8">
</head>
<body>
<main class="auth-page">
            <canvas class="auth-canvas-bg" data-src="/assets/video/auth-bg.png"></canvas>
    <div class="auth-video-overlay"></div><div class="auth-bg-orbs"><div class="auth-orb auth-orb-1"></div><div class="auth-orb auth-orb-2"></div><div class="auth-orb auth-orb-3"></div></div>
    <div class="auth-wrap">
        <a class="brand" href="/"><img src="/assets/logo.svg" alt="logo" class="brand-logo"><strong>系统治理中心</strong></a>
        <section class="auth-card">
            <div class="eyebrow">SYSTEM ADMINISTRATOR</div>
            <h1>超级管理员</h1>
            <p>统一管理用户、角色、基础数据与系统审计日志。</p>
            <form id="login-form" class="form">
                <label>系统账号
                    <input name="username" required placeholder="请输入超级管理员账号">
                </label>
                <label>密码
                    <input name="password" required type="password" placeholder="请输入密码">
                </label>
                <button class="btn btn-primary" type="submit">进入系统端</button>
            </form>
            <div class="auth-switch">
                <button type="button" class="auth-switch-btn">
                    其他身份登录
                    <svg class="auth-switch-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="auth-switch-menu" role="menu">
                    <a href="/login.html" role="menuitem"><span class="auth-switch-ico">🎓</span>考生登录</a>
                    <a href="/admin-login.html" role="menuitem"><span class="auth-switch-ico">👨‍💼</span>管理员登录</a>
                    <a href="/exam-staff-login.html" role="menuitem"><span class="auth-switch-ico">📋</span>考务人员登录</a>
                </div>
            </div>
            <div class="hint">演示账号：super / 123456</div>
        </section>
    </div>
</main>
<script src="/assets/js/api.js?v=11"></script>
<script src="/assets/js/auth.js?v=11"></script><script src="/assets/js/auth-canvas.js?v=1"></script><script src="/assets/js/auth-orbs.js?v=1"></script><script src="/assets/js/auth-switch.js?v=1"></script>
<script>bindLogin(3)</script>
</body>
</html>
