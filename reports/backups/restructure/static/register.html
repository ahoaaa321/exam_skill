<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 / 职业技能等级认定</title>
    <link rel="stylesheet" href="/assets/css/theme.css?v=8">
</head>
<body>
<main class="auth-page">
            <canvas class="auth-canvas-bg" data-src="/assets/video/auth-bg.png"></canvas>
    <div class="auth-video-overlay"></div><div class="auth-bg-orbs"><div class="auth-orb auth-orb-1"></div><div class="auth-orb auth-orb-2"></div><div class="auth-orb auth-orb-3"></div></div>
    <div class="auth-wrap">
        <a class="brand" href="/"><img src="/assets/logo.svg" alt="logo" class="brand-logo"><strong>职业技能等级认定</strong></a>
        <section class="auth-card">
            <div class="eyebrow">NEW CANDIDATE</div>
            <h1>创建考生账号</h1>
            <p>注册后即可浏览考试计划并提交报名申请。</p>
            <form id="register-form" class="form">
                <label>姓名
                    <input name="name" required placeholder="请输入真实姓名">
                </label>
                <label>身份证号
                    <input name="idCard" required maxlength="18" placeholder="请输入18位身份证号">
                </label>
                <label>手机号
                    <input name="phone" required maxlength="11" placeholder="请输入11位手机号">
                </label>
                <label>电子邮箱（用于接收验证码）
                    <input name="email" type="email" required placeholder="请输入QQ邮箱">
                </label>
                <label>邮箱验证码
                    <div class="code-input-group">
                        <input name="code" required placeholder="请输入6位验证码">
                        <button type="button" class="btn" id="send-code-btn">获取验证码</button>
                    </div>
                </label>
                <label>登录密码
                    <input name="password" required type="password" minlength="8" placeholder="至少8位，含字母和数字" id="pwd-input">
                    <div class="pwd-strength" id="pwd-strength">
                        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                        <span class="strength-text" id="strength-text">密码强度</span>
                    </div>
                </label>
                <label>确认密码
                    <input name="confirmPassword" required type="password" minlength="8" placeholder="请再次输入密码" id="confirm-pwd-input">
                    <span class="confirm-tip" id="confirm-tip" style="display:none;font-size:12px;margin-top:4px"></span>
                </label>
                <label>用户名
                    <input name="username" required placeholder="设置登录用户名">
                </label>
                <button class="btn btn-primary" type="submit">完成注册</button>
            </form>
            <div class="auth-foot">
                <a href="/login.html">← 返回登录</a>
            </div>
        </section>
    </div>
</main>

<script src="/assets/js/api.js?v=11"></script>
<script src="/assets/js/auth.js?v=11"></script><script src="/assets/js/auth-canvas.js?v=1"></script><script src="/assets/js/auth-orbs.js?v=1"></script>
<script>bindRegister()</script>
</body>
</html>
