<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 / 职业技能等级认定</title>
    <link rel="stylesheet" href="/assets/css/theme.css?v=9">
    <style>
        /* 认证创新组件：密码可见性切换 / 密码强度分段计 / 内联实时校验 / 卡片微倾斜 */
        .pwd-field { position: relative; }
        .pwd-field input { padding-right: 44px; }
        .pwd-toggle {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 32px; height: 32px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            background: transparent; border: none; border-radius: 8px;
            color: rgba(255,255,255,.55); cursor: pointer;
        }
        .pwd-toggle:hover { color: #fff; background: rgba(255,255,255,.14); }
        .pwd-toggle .eye-off { display: none; }
        .pwd-toggle.is-visible .eye-on { display: none; }
        .pwd-toggle.is-visible .eye-off { display: inline-flex; }
        .strength-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.5); margin-top: 4px; }
        .field-error { color: #ff8080; font-size: 12px; }
        .auth-card.tilt-card:not(.shake):hover { animation: none; }
    </style>
</head>
<body>
<main class="auth-page">
            <canvas class="auth-canvas-bg" data-src="/assets/img/auth-bg.png"></canvas>
    <div class="auth-video-overlay"></div><div class="auth-bg-orbs"><div class="auth-orb auth-orb-1"></div><div class="auth-orb auth-orb-2"></div><div class="auth-orb auth-orb-3"></div></div>
    <div class="auth-wrap">
        <a class="brand" href="/"><img src="/assets/logo.svg" alt="logo" class="brand-logo"><strong>职业技能等级认定</strong></a>
        <section class="auth-card tilt-card">
            <div class="eyebrow">NEW CANDIDATE</div>
            <h1>创建考生账号</h1>
            <p>注册后即可浏览考试计划并提交报名申请。</p>
            <form id="register-form" class="form">
                <label>姓名
                    <input name="name" required placeholder="请输入真实姓名">
                </label>
                <label>身份证号
                    <input name="idCard" required maxlength="18" placeholder="请输入18位身份证号">
                </label>
                <label>手机号
                    <input name="phone" required maxlength="11" placeholder="请输入11位手机号">
                </label>
                <label>电子邮箱（用于接收验证码）
                    <input name="email" type="email" required placeholder="请输入QQ邮箱" id="reg-email" autocomplete="email">
                    <span class="field-error" id="email-error" hidden></span>
                </label>
                <label>邮箱验证码
                    <div class="code-input-group">
                        <input name="code" required placeholder="请输入6位验证码">
                        <button type="button" class="btn" id="send-code-btn">获取验证码</button>
                    </div>
                </label>
                <label>登录密码
                    <div class="pwd-field">
                        <input name="password" required type="password" minlength="8" placeholder="至少8位，含字母和数字" id="pwd-input" autocomplete="new-password">
                        <button type="button" class="pwd-toggle" aria-label="显示密码">
                            <svg class="eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94C16.23 19.17 14.16 20 12 20 5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <div class="strength-meter" id="strength-meter">
                        <div class="strength-seg"></div>
                        <div class="strength-seg"></div>
                        <div class="strength-seg"></div>
                        <div class="strength-seg"></div>
                    </div>
                    <span class="strength-label" id="strength-label">密码强度</span>
                </label>
                <label>确认密码
                    <div class="pwd-field">
                        <input name="confirmPassword" required type="password" minlength="8" placeholder="请再次输入密码" id="confirm-pwd-input" autocomplete="new-password">
                        <button type="button" class="pwd-toggle" aria-label="显示密码">
                            <svg class="eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94C16.23 19.17 14.16 20 12 20 5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <span class="confirm-tip" id="confirm-tip" style="display:none;font-size:12px;margin-top:4px"></span>
                </label>
                <label>用户名
                    <input name="username" required placeholder="设置登录用户名" id="reg-username" autocomplete="username">
                    <span class="field-error" id="username-error" hidden></span>
                </label>
                <button class="btn btn-primary" type="submit">完成注册</button>
            </form>
            <div class="auth-foot">
                <a href="/auth/login.html">← 返回登录</a>
            </div>
        </section>
    </div>
</main>

<script src="/assets/js/common/api.js?v=12"></script>
<script src="/assets/js/auth/auth.js?v=11"></script><script src="/assets/js/auth/auth-canvas.js?v=1"></script><script src="/assets/js/auth/auth-orbs.js?v=1"></script>
<script>
(function () {
    var card = document.querySelector('.auth-card');
    var form = document.getElementById('register-form');
    var usernameInput = document.getElementById('reg-username');
    var usernameError = document.getElementById('username-error');
    var emailInput = document.getElementById('reg-email');
    var emailError = document.getElementById('email-error');
    var pwdInput = document.getElementById('pwd-input');
    var confirmInput = document.getElementById('confirm-pwd-input');
    var strengthSegs = document.querySelectorAll('#strength-meter .strength-seg');
    var strengthLabel = document.getElementById('strength-label');

    /* 错误抖动：350ms 后移除类，便于下次可重复触发 */
    function shakeCard() {
        if (!card) return;
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        setTimeout(function () { card.classList.remove('shake'); }, 350);
    }

    /* 密码可见性切换 */
    document.querySelectorAll('.pwd-toggle').forEach(function (btn) {
        var input = btn.parentElement.querySelector('input');
        btn.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
            btn.classList.toggle('is-visible', show);
        });
    });

    /* 4 级密码强度：<8=弱；≥8 小写+数字=中；≥10 大小写+数字=强；≥12 大小写+数字+特殊字符=很强 */
    var LV_TEXT = ['', '弱', '中', '强', '很强'];
    var LV_COLOR = ['', 'var(--danger)', 'var(--warning)', '#eab308', 'var(--success)'];
    function calcStrengthLv(pwd) {
        if (!pwd) return 0;
        var lo = /[a-z]/.test(pwd), up = /[A-Z]/.test(pwd), di = /\d/.test(pwd), sp = /[^a-zA-Z0-9]/.test(pwd);
        if (pwd.length >= 12 && lo && up && di && sp) return 4;
        if (pwd.length >= 10 && lo && up && di) return 3;
        if (pwd.length >= 8 && lo && di) return 2;
        return 1;
    }
    if (pwdInput) {
        pwdInput.addEventListener('input', function () {
            var lv = calcStrengthLv(pwdInput.value);
            strengthSegs.forEach(function (seg, i) {
                seg.className = 'strength-seg' + (i < lv ? ' lv' + lv : '');
            });
            if (strengthLabel) {
                strengthLabel.textContent = lv ? '密码强度：' + LV_TEXT[lv] : '密码强度';
                strengthLabel.style.color = lv ? LV_COLOR[lv] : '';
            }
        });
    }

    /* 用户名失焦校验：4-30 位字母数字下划线 */
    var USERNAME_RE = /^[A-Za-z0-9_]{4,30}$/;
    function validateUsername() {
        var val = usernameInput.value.trim();
        var bad = val !== '' && !USERNAME_RE.test(val);
        if (usernameError) {
            usernameError.textContent = bad ? '用户名需为 4-30 位字母、数字或下划线' : '';
            usernameError.hidden = !bad;
        }
        return !bad;
    }
    if (usernameInput) {
        usernameInput.addEventListener('blur', validateUsername);
        /* 已显示错误时随输入实时刷新提示，不打断输入 */
        usernameInput.addEventListener('input', function () {
            if (usernameError && !usernameError.hidden) validateUsername();
        });
    }

    /* 邮箱失焦校验 */
    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    function validateEmail() {
        var val = emailInput.value.trim();
        var bad = val !== '' && !EMAIL_RE.test(val);
        if (emailError) {
            emailError.textContent = bad ? '邮箱格式不正确，请检查后重试' : '';
            emailError.hidden = !bad;
        }
        return !bad;
    }
    if (emailInput) {
        emailInput.addEventListener('blur', validateEmail);
        emailInput.addEventListener('input', function () {
            if (emailError && !emailError.hidden) validateEmail();
        });
    }

    /* 提交前聚合校验（先于 bindRegister 注册；确认密码一致性沿用 auth.js 的实时提示与提交校验） */
    form.addEventListener('submit', function (event) {
        var okUsername = validateUsername();
        var okEmail = validateEmail();
        var okConfirm = pwdInput.value === confirmInput.value;
        if (!okUsername || !okEmail || !okConfirm) {
            event.preventDefault();
            event.stopImmediatePropagation();
            shakeCard();
            if (!okConfirm) toast('两次输入的密码不一致', 'error');
            else if (!okUsername) toast('用户名格式不正确', 'error');
            else toast('邮箱格式不正确', 'error');
        }
    });
})();
bindRegister()
</script>
</body>
</html>
