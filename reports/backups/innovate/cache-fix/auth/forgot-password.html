<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>找回密码 / 职业技能等级认定</title>
    <link rel="stylesheet" href="/assets/css/theme.css?v=9">
    <style>
        /* 认证创新组件：密码可见性切换 / 卡片微倾斜（hover 时释放入场动画的 fill 以便倾斜生效） */
        .pwd-field { position: relative; }
        .pwd-field input { padding-right: 44px; }
        .pwd-toggle {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 32px; height: 32px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            background: transparent; border: none; border-radius: 8px;
            color: rgba(255,255,255,.55); cursor: pointer;
        }
        .pwd-toggle:hover { color: #fff; background: rgba(255,255,255,.14); }
        .pwd-toggle .eye-off { display: none; }
        .pwd-toggle.is-visible .eye-on { display: none; }
        .pwd-toggle.is-visible .eye-off { display: inline-flex; }
        .auth-card.tilt-card:not(.shake):hover { animation: none; }
    </style>
</head>
<body>
<main class="auth-page">
            <canvas class="auth-canvas-bg" data-src="/assets/img/auth-bg.png"></canvas>
    <div class="auth-video-overlay"></div><div class="auth-bg-orbs"><div class="auth-orb auth-orb-1"></div><div class="auth-orb auth-orb-2"></div><div class="auth-orb auth-orb-3"></div></div>
    <div class="auth-wrap">
        <a class="brand" href="/"><img src="/assets/logo.svg" alt="logo" class="brand-logo"><strong>职业技能等级认定</strong></a>
        <section class="auth-card tilt-card">
            <div class="eyebrow">ACCOUNT RECOVERY</div>
            <h1>找回登录密码</h1>
            <p>选择一种方式验证身份后设置新密码。</p>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('email')">邮箱验证码</button>
                <button class="tab" onclick="switchTab('token')">恢复令牌</button>
            </div>

            <!-- 邮箱验证码方式 -->
            <form class="form" id="recovery-form" style="margin-top:20px">
                <label>注册邮箱
                    <input name="email" type="email" required placeholder="请输入注册时使用的邮箱" autocomplete="email">
                </label>
                <label>用户名
                    <input name="username" required placeholder="请输入账号用户名（公共邮箱用户必须填写用户名）" autocomplete="username">
                </label>
                <label>邮箱验证码
                    <div class="code-input-group">
                        <input name="code" required placeholder="请输入6位验证码">
                        <button type="button" class="btn" id="send-code-btn">获取验证码</button>
                    </div>
                </label>
                <label>新密码
                    <div class="pwd-field">
                        <input name="newPassword" required type="password" minlength="8" placeholder="至少8位，含字母和数字" autocomplete="new-password">
                        <button type="button" class="pwd-toggle" aria-label="显示密码">
                            <svg class="eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94C16.23 19.17 14.16 20 12 20 5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </label>
                <label>确认新密码
                    <div class="pwd-field">
                        <input name="confirmPassword" required type="password" minlength="8" placeholder="再次输入新密码" autocomplete="new-password">
                        <button type="button" class="pwd-toggle" aria-label="显示密码">
                            <svg class="eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94C16.23 19.17 14.16 20 12 20 5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </label>
                <button class="btn btn-primary" type="submit">确认重置密码</button>
            </form>

            <!-- 恢复令牌方式 -->
            <form class="form" id="token-form" hidden style="margin-top:20px">
                <label>账号恢复令牌
                    <input name="token" required placeholder="请输入注册时获得的16位恢复令牌">
                </label>
                <label>新密码
                    <div class="pwd-field">
                        <input name="newPassword" required type="password" minlength="8" placeholder="至少8位，含字母和数字" autocomplete="new-password">
                        <button type="button" class="pwd-toggle" aria-label="显示密码">
                            <svg class="eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94C16.23 19.17 14.16 20 12 20 5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </label>
                <label>确认新密码
                    <div class="pwd-field">
                        <input name="confirmPassword" required type="password" minlength="8" placeholder="再次输入新密码" autocomplete="new-password">
                        <button type="button" class="pwd-toggle" aria-label="显示密码">
                            <svg class="eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94C16.23 19.17 14.16 20 12 20 5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </label>
                <button class="btn btn-primary" type="submit">确认重置密码</button>
            </form>

            <div class="auth-foot">
                <a href="/auth/login.html">← 返回登录</a>
                <a href="/auth/register.html">注册账号</a>
            </div>
            <div class="hint">验证码将通过QQ邮箱发送，请注意查收</div>
        </section>
    </div>
</main>
<script src="/assets/js/common/api.js?v=13"></script>
<script src="/assets/js/auth/auth.js?v=12"></script><script src="/assets/js/auth/auth-canvas.js?v=1"></script><script src="/assets/js/auth/auth-orbs.js?v=1"></script>
<script>
(function () {
    var card = document.querySelector('.auth-card');

    /* 错误抖动：350ms 后移除类，便于下次可重复触发 */
    function shakeCard() {
        if (!card) return;
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        setTimeout(function () { card.classList.remove('shake'); }, 350);
    }

    /* 密码可见性切换（两个表单共 4 个密码框） */
    document.querySelectorAll('.pwd-toggle').forEach(function (btn) {
        var input = btn.parentElement.querySelector('input');
        btn.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
            btn.classList.toggle('is-visible', show);
        });
    });

    /* 两次密码不一致提交时抖动（toast 由 auth.js 既有逻辑弹出） */
    ['recovery-form', 'token-form'].forEach(function (id) {
        var f = document.getElementById(id);
        if (!f) return;
        f.addEventListener('submit', function () {
            var np = f.querySelector('[name="newPassword"]');
            var cp = f.querySelector('[name="confirmPassword"]');
            if (np && cp && np.value !== cp.value) shakeCard();
        });
    });

    /* 重置接口失败时抖动（不改动 auth.js） */
    ['resetPassword', 'resetPasswordByToken'].forEach(function (name) {
        var raw = API[name].bind(API);
        API[name] = function () {
            return raw.apply(API, arguments).catch(function (error) {
                shakeCard();
                throw error;
            });
        };
    });
})();
bindForgotPassword()
</script>
</body>
</html>
